<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>earn222 - Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#06101d,#071c31,#062b4b);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.box{
  width:100%;
  max-width:390px;
  background:#0a1b2d;
  border:1px solid #1c5278;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 40px #0008;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:5px;
}

.logo span{
  color:#28d7ff;
}

.sub{
  text-align:center;
  color:#86a8c3;
  font-size:12px;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  padding:11px;
  border:1px solid #245777;
  border-radius:10px;
  background:#0d263d;
  color:#9db9cc;
  font-weight:bold;
}

.tabs button.active{
  background:#087ed1;
  color:#fff;
  border-color:#13bfff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#a9c5d9;
  font-size:11px;
  margin:11px 0 5px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #245777;
  background:#061525;
  color:#fff;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#16bfff;
  box-shadow:0 0 0 2px #16bfff22;
}

.passbox{
  position:relative;
}

.passbox input{
  padding-right:45px;
}

.eye{
  position:absolute;
  right:8px;
  top:7px;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#9db9cc;
  font-size:17px;
}

.btn{
  width:100%;
  margin-top:17px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#087fe0,#10c7ff);
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

.btn:active{
  transform:scale(.98);
}

.msg{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  font-size:11px;
  color:#55dcff;
}

.small{
  text-align:center;
  margin-top:14px;
  color:#7898ad;
  font-size:10px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">earn<span>222</span></div>
  <div class="sub">EARN • TASKS • REWARDS</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    <button id="registerTab" onclick="showRegister()">Registration</button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm" class="form active">

    <label>Email Address</label>
    <input id="loginEmail"
           type="email"
           placeholder="আপনার Gmail লিখুন"
           autocomplete="email">

    <label>Password</label>
    <div class="passbox">
      <input id="loginPassword"
             type="password"
             placeholder="পাসওয়ার্ড লিখুন"
             autocomplete="current-password">
      <button class="eye" onclick="togglePass('loginPassword')">👁</button>
    </div>

    <button class="btn" id="loginBtn" onclick="login()">
      লগইন করুন
    </button>

    <div class="msg" id="loginMsg"></div>
  </div>


  <!-- REGISTRATION -->
  <div id="registerForm" class="form">

    <label>পূর্ণ নাম</label>
    <input id="regName"
           type="text"
           placeholder="আপনার নাম লিখুন"
           autocomplete="name">

    <label>মোবাইল নাম্বার</label>
    <input id="regMobile"
           type="tel"
           placeholder="01XXXXXXXXX"
           autocomplete="tel">

    <label>Email Address</label>
    <input id="regEmail"
           type="email"
           placeholder="আপনার Gmail লিখুন"
           autocomplete="email">

    <label>Password</label>
    <div class="passbox">
      <input id="regPassword"
             type="password"
             placeholder="পাসওয়ার্ড দিন"
             autocomplete="new-password">
      <button class="eye" onclick="togglePass('regPassword')">👁</button>
    </div>

    <label>Confirm Password</label>
    <div class="passbox">
      <input id="regConfirm"
             type="password"
             placeholder="পাসওয়ার্ড আবার দিন"
             autocomplete="new-password">
      <button class="eye" onclick="togglePass('regConfirm')">👁</button>
    </div>

    <label>Invite Code (ঐচ্ছিক)</label>
    <input id="regInvite"
           type="text"
           placeholder="Invite Code থাকলে দিন">

    <button class="btn" id="registerBtn" onclick="register()">
      অ্যাকাউন্ট তৈরি করুন
    </button>

    <div class="msg" id="registerMsg"></div>
  </div>

  <div class="small">
    © 2026 earn222
  </div>

</div>


<script>

const SUPABASE_URL =
"https://uvnauldjuvkwonufgayz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_i7nrYBDU_YkpI528VM7xnw_skuQXidW";


/* আগে থেকেই লগইন থাকলে Dashboard */
if(localStorage.getItem("earn222_access_token")){
  location.replace("earn222_dashboard.html");
}


/* LOGIN / REGISTRATION পরিবর্তন */

function showLogin(){

  document.getElementById("loginForm")
    .classList.add("active");

  document.getElementById("registerForm")
    .classList.remove("active");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("registerTab")
    .classList.remove("active");

}


function showRegister(){

  document.getElementById("registerForm")
    .classList.add("active");

  document.getElementById("loginForm")
    .classList.remove("active");

  document.getElementById("registerTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

}


/* PASSWORD SHOW / HIDE */

function togglePass(id){

  const input=document.getElementById(id);

  input.type =
    input.type==="password"
    ? "text"
    : "password";

}


/* LOGIN */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const msg =
    document.getElementById("loginMsg");

  const btn =
    document.getElementById("loginBtn");


  if(!email || !password){

    msg.textContent="ইমেইল ও পাসওয়ার্ড দিন।";
    return;

  }


  btn.disabled=true;
  btn.textContent="লগইন হচ্ছে...";
  msg.textContent="";


  try{

    const res =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data=await res.json();


    if(!res.ok){

      msg.textContent =
        data.error_description ||
        data.msg ||
        "ইমেইল অথবা পাসওয়ার্ড ভুল।";

      btn.disabled=false;
      btn.textContent="লগইন করুন";
      return;

    }


    /* Login সফল */

    localStorage.setItem(
      "earn222_access_token",
      data.access_token || ""
    );

    localStorage.setItem(
      "earn222_user_email",
      email
    );


    msg.textContent="লগইন সফল হয়েছে।";

    setTimeout(function(){

      location.replace(
        "earn222_dashboard.html"
      );

    },300);


  }catch(error){

    msg.textContent=
      "ইন্টারনেট সংযোগে সমস্যা হয়েছে।";

    btn.disabled=false;
    btn.textContent="লগইন করুন";

  }

}


/* REGISTRATION */

async function register(){

  const name =
    document.getElementById("regName").value.trim();

  const mobile =
    document.getElementById("regMobile").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const password =
    document.getElementById("regPassword").value;

  const confirm =
    document.getElementById("regConfirm").value;

  const invite =
    document.getElementById("regInvite").value.trim();

  const msg =
    document.getElementById("registerMsg");

  const btn =
    document.getElementById("registerBtn");


  if(!name){

    msg.textContent="পূর্ণ নাম দিন।";
    return;

  }


  if(!mobile){

    msg.textContent="মোবাইল নাম্বার দিন।";
    return;

  }


  if(!email){

    msg.textContent="Gmail দিন।";
    return;

  }


  if(!password){

    msg.textContent="পাসওয়ার্ড দিন।";
    return;

  }


  if(password !== confirm){

    msg.textContent="দুইটি পাসওয়ার্ড মিলছে না।";
    return;

  }


  if(password.length < 6){

    msg.textContent=
      "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।";

    return;

  }


  btn.disabled=true;
  btn.textContent="অ্যাকাউন্ট তৈরি হচ্ছে...";
  msg.textContent="";


  try{

    const res =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/signup",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY
          },

          body:JSON.stringify({

            email:email,

            password:password,

            data:{
              full_name:name,
              mobile:mobile,
              invite_code:invite
            }

          })
        }
      );


    const data=await res.json();


    if(!res.ok){

      msg.textContent =
        data.msg ||
        data.error_description ||
        "রেজিস্ট্রেশন করা যায়নি।";

      btn.disabled=false;
      btn.textContent="অ্যাকাউন্ট তৈরি করুন";
      return;

    }


    msg.textContent=
      "রেজিস্ট্রেশন সফল! এখন Login করুন।";


    /* Login পেজে নিয়ে যাবে */

    document.getElementById("loginEmail").value=email;

    setTimeout(function(){

      showLogin();

    },700);


  }catch(error){

    msg.textContent=
      "ইন্টারনেট সংযোগে সমস্যা হয়েছে।";

  }


  btn.disabled=false;
  btn.textContent="অ্যাকাউন্ট তৈরি করুন";

}

</script>

</body>
</html>
