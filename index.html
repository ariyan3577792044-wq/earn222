</style></head><body><main class="wrap"><div class="brand">earn<span>222</span></div><div class="title" id="pageTitle">Welcome Back</div><div class="sub" id="pageSub">আপনার অ্যাকাউন্টে লগইন করুন</div><section class="card">

</section></main><script>
const U='https://uvnauldjuvkwonufgayz.supabase.co',K='sb_publishable_i7nrYBDU_YkpI528VM7xnw_skuQXidW';
function togglePass(id){const p=document.getElementById(id);p.type=p.type==='password'?'text':'password'}
function showRegister(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('registerBox').classList.remove('hidden');document.getElementById('pageTitle').textContent='Create Your Account';document.getElementById('pageSub').textContent='সহজে রেজিস্ট্রেশন করুন এবং আয় শুরু করুন'}
function showLogin(){document.getElementById('registerBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');document.getElementById('pageTitle').textContent='Welcome Back';document.getElementById('pageSub').textContent='আপনার অ্যাকাউন্টে লগইন করুন'}
document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!email||!password){msg.textContent='ইমেইল ও পাসওয়ার্ড দিন।';return}msg.textContent='লগইন হচ্ছে...';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({email,password})});const d=await r.json();if(r.ok){localStorage.setItem('earn222_access_token',d.access_token||'');localStorage.setItem('earn222_user_email',email);msg.textContent='লগইন সফল হয়েছে।';setTimeout(()=>{location.href='earn222_dashboard.html'},500)}else msg.textContent=d.error_description||d.msg||d.message||'ইমেইল বা পাসওয়ার্ড সঠিক নয়।'}catch(e){msg.textContent='ইন্টারনেট সংযোগে সমস্যা হয়েছে।'}};
document.getElementById('register').onclick=async()=>{const name=document.getElementById('rname').value.trim(),mobile=document.getElementById('rmobile').value.trim(),p=document.getElementById('rpass').value,c=document.getElementById('rconfirm').value,email=document.getElementById('remail').value.trim(),invite=document.getElementById('rinvite').value.trim(),msg=document.getElementById('registerMsg');if(!name){msg.textContent='আপনার নাম দিন।';return}if(!/^01\d{9}$/.test(mobile)){msg.textContent='সঠিক ১১ সংখ্যার মোবাইল নাম্বার দিন।';return}if(p.length<6){msg.textContent='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';return}if(p!==c){msg.textContent='দুইটি পাসওয়ার্ড মিলছে না।';return}if(!email){msg.textContent='ইমেইল ঠিকানা দিন।';return}msg.textContent='অ্যাকাউন্ট তৈরি হচ্ছে...';try{const r=await fetch(U+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({email,password:p,data:{full_name:name,mobile:mobile,invite_code:invite}})});const d=await r.json();if(r.ok){msg.textContent='অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করুন।';setTimeout(showLogin,700)}else msg.textContent=d.msg||d.error_description||d.message||'রেজিস্ট্রেশন করা যায়নি।'}catch(e){msg.textContent='ইন্টারনেট সংযোগে সমস্যা হয়েছে।'}};
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('earn222_access_token');localStorage.removeItem('earn222_user_email');document.getElementById('dashboardBox').classList.add('hidden');showLogin()};
</script></body></html>
