<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>earn222 - Registration & Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#06101d,#071d35,#06101d);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.box{
  width:100%;
  max-width:420px;
  background:#0b1b2d;
  border:1px solid #1b4968;
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 35px #0008;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:5px;
}

.logo span{
  color:#35d9ff;
}

.sub{
  text-align:center;
  color:#8ca8c0;
  font-size:11px;
  margin-bottom:18px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  border:1px solid #214d69;
  background:#081625;
  color:#91aabe;
  padding:11px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
}

.tab.active{
  background:linear-gradient(135deg,#087cff,#15c8ff);
  color:#fff;
  border-color:#15bfff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#a9c4d9;
  font-size:10px;
  margin:9px 0 5px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #214d69;
  background:#071522;
  color:#fff;
  outline:none;
  font-size:13px;
}

input:focus{
  border-color:#19bfff;
  box-shadow:0 0 0 2px #19bfff22;
}

button.main{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#087cff,#15c8ff);
  color:#fff;
  font-size:14px;
  font-weight:bold;
}

button.main:active{
  transform:scale(.98);
}

.msg{
  min-height:18px;
  text-align:center;
  margin-top:12px;
  font-size:11px;
  color:#54dfff;
}

.footer{
  text-align:center;
  color:#66839c;
  font-size:9px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">earn<span>222</span></div>
  <div class="sub">EARN • TASKS • REWARDS</div>

  <div class="tabs">
    <button class="tab active" id="registerTab" onclick="showRegister()">
      রেজিস্ট্রেশন
    </button>

    <button class="tab" id="loginTab" onclick="showLogin()">
      লগইন
    </button>
  </div>


  <!-- REGISTRATION -->
  <div class="form active" id="registerForm">

    <label>পূর্ণ নাম</label>
    <input id="regName" type="text" placeholder="আপনার নাম">

    <label>মোবাইল নাম্বার</label>
    <input id="regMobile" type="tel" placeholder="01XXXXXXXXX">

    <label>Gmail</label>
    <input id="regEmail" type="email" placeholder="example@gmail.com">

    <label>পাসওয়ার্ড</label>
    <input id="regPassword" type="password" placeholder="কমপক্ষে ৬ অক্ষর">

    <label>পাসওয়ার্ড আবার লিখুন</label>
    <input id="regConfirm" type="password" placeholder="পাসওয়ার্ড নিশ্চিত করুন">

    <label>Invite Code</label>
    <input id="regInvite" type="text" placeholder="Invite Code">

    <button class="main" onclick="registerUser()">
      রেজিস্ট্রেশন করুন
    </button>

  </div>


  <!-- LOGIN -->
  <div class="form" id="loginForm">

    <label>Gmail</label>
    <input id="loginEmail" type="email" placeholder="example@gmail.com">

    <label>পাসওয়ার্ড</label>
    <input id="loginPassword" type="password" placeholder="আপনার পাসওয়ার্ড">

    <button class="main" onclick="loginUser()">
      লগইন করুন
    </button>

  </div>


  <div class="msg" id="msg"></div>

  <div class="footer">
    earn222 © 2026
  </div>

</div>


<script>

const SUPABASE_URL =
"https://uvnauldjuvkwonufgayz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_i7nrYBDU_YkpI528VM7xnw_skuQXidW";


/* =========================
   SHOW REGISTER
========================= */

function showRegister(){

  document.getElementById("registerForm")
    .classList.add("active");

  document.getElementById("loginForm")
    .classList.remove("active");

  document.getElementById("registerTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("msg").textContent="";
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById("loginForm")
    .classList.add("active");

  document.getElementById("registerForm")
    .classList.remove("active");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("registerTab")
    .classList.remove("active");

  document.getElementById("msg").textContent="";
}


/* =========================
   REGISTRATION
========================= */

async function registerUser(){

  const name =
    document.getElementById("regName").value.trim();

  const mobile =
    document.getElementById("regMobile").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const password =
    document.getElementById("regPassword").value;

  const confirm =
    document.getElementById("regConfirm").value;

  const invite =
    document.getElementById("regInvite").value.trim();

  const msg =
    document.getElementById("msg");


  if(!name || !mobile || !email || !password){

    msg.textContent="সব তথ্য পূরণ করুন।";
    return;
  }


  if(password.length < 6){

    msg.textContent="পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।";
    return;
  }


  if(password !== confirm){

    msg.textContent="দুইটি পাসওয়ার্ড মিলছে না।";
    return;
  }


  msg.textContent="রেজিস্ট্রেশন হচ্ছে...";


  try{

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/signup",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },

        body:JSON.stringify({

          email:email,

          password:password,

          data:{
            full_name:name,
            mobile:mobile,
            invite_code:invite
          }

        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      msg.textContent =
        data.msg ||
        data.error_description ||
        data.message ||
        "রেজিস্ট্রেশন করা যায়নি।";

      return;
    }


    msg.textContent =
      "রেজিস্ট্রেশন সফল! এখন Login করুন।";


    document.getElementById("loginEmail").value =
      email;


    setTimeout(function(){

      showLogin();

    },800);


  }catch(error){

    msg.textContent =
      "ইন্টারনেট বা সার্ভারের সমস্যা হয়েছে।";

  }

}


/* =========================
   LOGIN
========================= */

async function loginUser(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const msg =
    document.getElementById("msg");


  if(!email || !password){

    msg.textContent =
      "Gmail এবং পাসওয়ার্ড দিন।";

    return;
  }


  msg.textContent =
    "লগইন হচ্ছে...";


  try{

    const response = await fetch(

      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },

        body:JSON.stringify({

          email:email,

          password:password

        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      msg.textContent =
        data.error_description ||
        data.msg ||
        data.message ||
        "Gmail অথবা পাসওয়ার্ড ভুল।";

      return;
    }


    /* LOGIN SUCCESS */

    localStorage.setItem(
      "earn222_access_token",
      data.access_token || ""
    );

    localStorage.setItem(
      "earn222_user_email",
      email
    );


    msg.textContent =
      "লগইন সফল হয়েছে।";


    setTimeout(function(){

      location.replace(
        "earn222_dashboard.html"
      );

    },500);


  }catch(error){

    msg.textContent =
      "ইন্টারনেট বা সার্ভারের সমস্যা হয়েছে।";

  }

}

</script>

</body>
</html>
