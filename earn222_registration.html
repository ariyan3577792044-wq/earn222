<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>earn222 - Create Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#172a46}.hero{height:150px;background:linear-gradient(135deg,#1986ef,#3188e8);border-radius:0 0 42px 42px}.card{max-width:420px;margin:-48px auto 20px;background:#fff;border-radius:30px;padding:24px 22px 24px;position:relative;box-shadow:0 8px 25px #0001}h1{font-size:30px;margin:0 0 10px;font-weight:800}.sub{font-size:16px;line-height:1.45;color:#7d8791;margin-bottom:20px}.field{margin-bottom:13px}.wrap{position:relative}.field input{width:100%;height:52px;border:1.5px solid #dce4ec;border-radius:17px;padding:0 45px 0 18px;font-size:16px;outline:none;background:#fbfcfd}.field input:focus{border-color:#2381ea}.icon{position:absolute;right:15px;top:14px;font-size:20px}.hint{font-size:12px;color:#9aa3ad;margin:4px 6px 0}button{width:100%;height:54px;border:0;border-radius:17px;background:linear-gradient(135deg,#167fe9,#0878e8);color:#fff;font-size:18px;font-weight:800;margin-top:4px}.msg{text-align:center;margin-top:10px;font-size:13px;min-height:20px;color:#2770d8}</style></head><body><div class="hero"></div><div class="card"><h1>Create Account</h1><div class="sub">আজই যোগ দিন earn222 প্ল্যাটফর্মে এবং আয় শুরু করুন</div><form id="form"><div class="field"><div class="wrap"><input id="name" placeholder="Full Name" required><span class="icon">👤</span></div><div class="hint">আপনার পুরো নাম লিখুন</div></div><div class="field"><div class="wrap"><input id="mobile" inputmode="numeric" maxlength="11" placeholder="Bangladeshi Mobile Number" required><span class="icon">📱</span></div><div class="hint">০১ দিয়ে শুরু ১১ সংখ্যার মোবাইল নম্বর দিন</div></div><div class="field"><div class="wrap"><input id="password" type="password" minlength="6" placeholder="Password" required><span class="icon">👁️</span></div><div class="hint">কমপক্ষে ৬টি অক্ষর ব্যবহার করুন</div></div><div class="field"><div class="wrap"><input id="confirm" type="password" minlength="6" placeholder="Confirm Password" required><span class="icon">👁️</span></div><div class="hint">পাসওয়ার্ডটি আবার লিখুন</div></div><div class="field"><div class="wrap"><input id="email" type="email" placeholder="Email Address" required><span class="icon">✉️</span></div><div class="hint">আপনার বৈধ ইমেইল ঠিকানা দিন</div></div><div class="field"><div class="wrap"><input id="invite" placeholder="Invite Code"><span class="icon">🎁</span></div><div class="hint">ইনভাইট কোড থাকলে দিন (ঐচ্ছিক)</div></div><button type="submit">Register Now →</button><div class="msg" id="msg"></div></form></div><script>const URL='https://uvnauldjuvkwonufgayz.supabase.co',KEY='sb_publishable_i7nrYBDU_YkpI528VM7xnw_skuQXidW',sb=supabase.createClient(URL,KEY);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,email=document.getElementById('email').value.trim(),invite=document.getElementById('invite').value.trim();if(!/^01\d{9}$/.test(mobile)){msg.textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।';return}if(password!==confirm){msg.textContent='Password এবং Confirm Password একই হতে হবে।';return}msg.textContent='অ্যাকাউন্ট তৈরি হচ্ছে...';const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,mobile,invite_code:invite}}});if(error){msg.textContent=error.message;return}msg.textContent=data.session?'অ্যাকাউন্ট তৈরি হয়েছে।':'অ্যাকাউন্ট তৈরি হয়েছে। Email Confirm করে Login করুন।';});</script></body></html>
